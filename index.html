<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestige TechnoStar - Water Control Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary-blue: #2563eb;
    --primary-gray: #f8fafc;
    --card-bg: #ffffff;
    --text-dark: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 24px;
    line-height: 1.6;
}

.container {
    max-width: 1800px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 48px;
    padding: 32px 0;
}

.header h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 700;
    color: var(--primary-blue);
    margin-bottom: 8px;
    letter-spacing: -0.025em;
}

.header .subtitle {
    font-size: 1.2rem;
    color: var(--text-muted);
    font-weight: 400;
}

.status-bar {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 24px;
}

.status-chip {
    background: var(--card-bg);
    padding: 12px 24px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    font-weight: 500;
    font-size: 0.95rem;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
}

.status-chip:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
}

.status-live {
    background: #ecfdf5;
    border-color: var(--success);
    color: var(--success);
}

.status-loading {
    background: #fef3c7;
    border-color: var(--warning);
    color: var(--warning);
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
    box-shadow: var(--shadow-md);
    transition: all 0.3s ease;
}

.card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-2px);
}

.card-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 2px solid #f1f5f9;
}

.card-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 600;
}

.today .card-icon {
    background: linear-gradient(135deg, var(--primary-blue), #3b82f6);
    color: white;
}

.yesterday .card-icon {
    background: linear-gradient(135deg, #06b6d4, #0891b2);
    color: white;
}

.day-before .card-icon {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
}

.card-title {
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--text-dark);
}

.card-date {
    font-size: 0.95rem;
    color: var(--text-muted);
    margin-top: 4px;
}

.data-table {
    overflow-x: auto;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    background: var(--card-bg);
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1100px;
    font-size: 0.95rem;
}

th, td {
    padding: 16px 20px;
    text-align: center;
    border-bottom: 1px solid #f8fafc;
}

th {
    background: #f8fafc;
    font-weight: 600;
    color: var(--text-dark);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.85rem;
    position: sticky;
    top: 0;
    z-index: 10;
}

.category-header {
    background: linear-gradient(135deg, var(--primary-blue), #3b82f6) !important;
    color: white !important;
    font-weight: 700;
    font-size: 1rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

.sub-header {
    background: #f1f5f9 !important;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.85rem;
}

.data-row td {
    font-weight: 500;
    transition: all 0.2s ease;
}

.data-row:hover td {
    background: #f8fafc;
}

.status-positive {
    color: var(--success);
    font-weight: 700;
    background: #ecfdf5;
    border: 2px solid #d1fae5;
    border-radius: 8px;
    padding: 4px 12px;
}

.status-negative {
    color: var(--danger);
    font-weight: 700;
    background: #fef2f2;
    border: 2px solid #fecaca;
    border-radius: 8px;
    padding: 4px 12px;
    animation: pulse 2s infinite;
}

.status-neutral {
    color: var(--text-muted);
    font-style: italic;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.8; }
}

.no-data {
    color: var(--text-muted);
    font-style: italic;
    background: #f8fafc;
}

/* Responsive */
@media (max-width: 1200px) {
    table { min-width: 950px; }
    .container { padding: 16px; }
}

@media (max-width: 768px) {
    body { padding: 16px; }
    .card { padding: 24px 20px; margin-bottom: 24px; }
    table { min-width: 800px; }
    .status-bar { flex-direction: column; align-items: center; gap: 12px; }
    .status-chip { padding: 10px 20px; }
}

@media (max-width: 480px) {
    .card-header { flex-direction: column; text-align: center; gap: 12px; }
    table { min-width: 700px; }
    th, td { padding: 12px 10px; font-size: 0.9rem; }
}
</style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Prestige TechnoStar</h1>
            <p class="subtitle">Water Control Dashboard - Office Display</p>
            <div class="status-bar">
                <div class="status-chip status-live" id="status">✓ System Online</div>
                <div class="status-chip status-live">📊 Live Data Feed</div>
                <div class="status-chip status-live">🔄 Auto Refresh: 30s</div>
            </div>
        </div>

        <div class="card today" id="today-panel">
            <div class="card-header today">
                <div class="card-icon">📊</div>
                <div>
                    <div class="card-title" id="tText">Today</div>
                    <div class="card-date"></div>
                </div>
            </div>
            <div class="data-table">
                <table id="today"></table>
            </div>
        </div>

        <div class="card yesterday" id="yesterday-panel">
            <div class="card-header yesterday">
                <div class="card-icon">📈</div>
                <div>
                    <div class="card-title" id="yText">Yesterday</div>
                    <div class="card-date"></div>
                </div>
            </div>
            <div class="data-table">
                <table id="yesterday"></table>
            </div>
        </div>

        <div class="card day-before" id="day-before-panel">
            <div class="card-header day-before">
                <div class="card-icon">📉</div>
                <div>
                    <div class="card-title" id="y2Text">Day Before</div>
                    <div class="card-date"></div>
                </div>
            </div>
            <div class="data-table">
                <table id="y2"></table>
            </div>
        </div>
    </div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/1b-8OGZK56Ejqm0SO44KzpCyo80awEODk/export?format=csv&gid=348275697";

function formatDate(d) { return d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear().toString().slice(-2); }
function parseSheetDate(str) { if (!str) return null; let p = str.split("/"); return new Date("20" + p[2], p[1] - 1, p[0]); }
function sameDate(d1, d2) { return d1 && d1.getDate() == d2.getDate() && d1.getMonth() == d2.getMonth() && d1.getFullYear() == d2.getFullYear(); }
function fullDate(d) { return d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', year:'numeric'}); }

function updateStatus(text, isLoading = false) {
    const statusEl = document.getElementById('status');
    statusEl.textContent = text;
    statusEl.className = `status-chip ${isLoading ? 'status-loading' : 'status-live'}`;
}

function load() {
    updateStatus('Loading data...', true);
    
    Papa.parse(URL, {
        download: true,
        skipEmptyLines: true,
        complete: function(res) {
            let rows = res.data;
            if (rows.length < 5) {
                updateStatus('Data error', false);
                return;
            }

            let group = rows[0], h1 = rows[1], h2 = rows[2], data = rows.slice(3);
            let now = new Date(), y1 = new Date(); y1.setDate(now.getDate()-1), y2 = new Date(); y2.setDate(now.getDate()-2);

            let todayRow = data.find(r => sameDate(parseSheetDate(r[1]), now));
            let yRow = data.find(r => sameDate(parseSheetDate(r[1]), y1));
            let y2Row = data.find(r => sameDate(parseSheetDate(r[1]), y2));

            draw("today", group, h1, h2, todayRow, now);
            draw("yesterday", group, h1, h2, yRow, y1);
            draw("y2", group, h1, h2, y2Row, y2);

            updateStatus('System Online', false);
        },
        error: function() { updateStatus('Connection Lost', false); }
    });
}

function draw(id, group, h1, h2, row, date) {
    let table = document.getElementById(id);
    let html = "";

    html += "<tr class='category-header'>"; 
    group.forEach(c => html += `<th>${c||""}</th>`); 
    html += "</tr>";
    
    html += "<tr class='sub-header'>"; 
    h1.forEach(c => html += `<th>${c||""}</th>`); 
    html += "</tr>";
    
    html += "<tr class='sub-header'>"; 
    h2.forEach(c => html += `<th>${c||""}</th>`); 
    html += "</tr>";
    
    html += "<tr class='data-row'>";
    if (row) {
        h1.forEach((_,i) => {
            let val = row[i] || 0;
            if (!isNaN(val) && val !== '') {
                let num = Number(val);
                if (num < 0) html += `<td class="status-negative">${val}</td>`;
                else if (num > 0) html += `<td class="status-positive">${val}</td>`;
                else html += `<td class="status-neutral">${val}</td>`;
            } else {
                html += `<td class="status-neutral">${val || '-'}</td>`;
            }
        });
    } else {
        h1.forEach(() => html += "<td class='no-data'>No Data</td>");
    }
    html += "</tr>";

    table.innerHTML = html;
    
    // Update date
    const titleEl = document.getElementById(id === 'today' ? 'tText' : id === 'yesterday' ? 'yText' : 'y2Text');
    const dateEl = titleEl.parentElement.querySelector('.card-date');
    titleEl.innerText = id === 'today' ? 'Today' : id === 'yesterday' ? 'Yesterday' : 'Day Before';
    dateEl.innerText = fullDate(date);
}

setInterval(load, 30000);
load();
</script>
</body>
</html>
